apis:
- aid: virtuix:virtuix-agent-commerce
  name: Virtuix Agent Commerce (UCP / MCP)
  description: The UCP-conforming Model Context Protocol endpoint Virtuix serves from its own domain.
    Thirteen tools cover catalog search and lookup, product detail, cart create/update/cancel, checkout
    create/update/complete/cancel and order retrieval, letting an agent shop the Omni One catalog end
    to end. It answers unauthenticated JSON-RPC 2.0 over HTTP POST at MCP protocol 2025-06-18 and declares
    UCP 2026-08-25. The runtime is the Shopify universal-commerce server; the catalog, the domain and
    the merchant identity ("Omni One by Virtuix") are Virtuix's.
  humanURL: https://virtuix.com/
  baseURL: https://virtuix.com/api/ucp/mcp
