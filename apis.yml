aid: virtuix
name: Virtuix
description: Virtuix is an Austin, Texas maker of omnidirectional VR treadmills. Omni One pairs a full-body
  VR movement system with its own game store, and Omni Arena is the turnkey location-based VR esports
  attraction it sells to entertainment venues, with built-in contests and leaderboards. Virtuix runs a
  real developer program for Omni One — a licensed Unity and Unreal Engine SDK exposing Core, Application,
  User, Achievements, Leaderboards, Multiplayer and Entitlement Check services, plus the Omni Dev portal
  where studios register game projects, define leaderboards and publish to the Omni One store — but that
  platform is reachable only through the game-engine SDK, and Virtuix publishes no OpenAPI and no public
  HTTP API for it. Its one machine-callable surface is an anonymous, UCP-conforming MCP agent-commerce
  endpoint on its own domain, which lets an agent search the Omni One catalog and build a cart and checkout
  with no credential.
