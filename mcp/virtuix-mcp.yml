tools:
  - name: get_checkout
    server: virtuix-ucp-commerce
    description: Returns details about the checkout, including line items, totals, discounts and taxes.
  - name: create_checkout
    server: virtuix-ucp-commerce
    description: Creates a checkout and returns its details.
  - name: update_checkout
    server: virtuix-ucp-commerce
    description: Updates a checkout and returns its details.
  - name: complete_checkout
    server: virtuix-ucp-commerce
    description: Completes a checkout and returns the checkout result.
  - name: cancel_checkout
    server: virtuix-ucp-commerce
    description: Cancels a checkout.
  - name: get_cart
    server: virtuix-ucp-commerce
    description: Get the cart contents.
  - name: create_cart
    server: virtuix-ucp-commerce
    description: Creates a new cart.
  - name: update_cart
    server: virtuix-ucp-commerce
    description: Perform updates to a cart (line items, buyer info, delivery, discounts, notes).
  - name: cancel_cart
    server: virtuix-ucp-commerce
    description: Cancels a cart.
  - name: get_order
    server: virtuix-ucp-commerce
    description: Get the details of an order.
  - name: search_catalog
    server: virtuix-ucp-commerce
    description: Search Virtuix products with natural-language queries and/or filters. Conforms to dev.ucp.shopping.catalog.search.
  - name: lookup_catalog
    server: virtuix-ucp-commerce
    description: Look up multiple products or variants by identifier.
  - name: get_product
    server: virtuix-ucp-commerce
    description: Retrieve complete product detail by identifier.
  - name: search_shop_policies_and_faqs
    server: virtuix-storefront-mcp
    description: Get facts about the store's policies, products or services. (deprecated server)
  - name: get_product_details
    server: virtuix-storefront-mcp
    description: Look up a product by id, optionally selecting a variant. (deprecated server)
