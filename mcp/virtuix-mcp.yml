source: https://virtuix.com/api/ucp/mcp
ownership: >-
  Both MCP endpoints are served from virtuix.com, Virtuix's own registrable domain, and expose
  Virtuix's own product catalog (the tool responses return "Omni One Developer License", "Omni One",
  Omni One accessories and Omni One game titles, and the store's UCP document names the merchant
  "Omni One by Virtuix" with merchant_origin checkout.virtuix.com). The MCP runtime itself is the
  Shopify storefront/universal-commerce server (serverInfo.name "universal-commerce" /
  "storefront-renderer"), i.e. Virtuix's commerce surface operated on Shopify — not a
  Virtuix-authored protocol server. Recorded with that provenance stated.
