    version: '2025-06-18'
    conforms: true
    evidence: >-
      POST https://virtuix.com/api/ucp/mcp initialize returned protocolVersion 2025-06-18 with
      tools/prompts/resources/logging capabilities
  - id: json-schema-2020-12
    conforms: true
