domain_standard:
  market: agentic commerce / retail
  standard: ucp
  declared_in_contract: true
  evidence: >-
    https://virtuix.com/.well-known/ucp.json — the store's own discovery document declares the
    dev.ucp.shopping service namespace, seven dev.ucp.shopping.* capabilities and the
